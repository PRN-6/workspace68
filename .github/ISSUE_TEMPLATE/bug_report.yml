name: Bug Report
description: Create a report to help us improve workspace68
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Open the visual builder
        2. Drag component X to canvas
        3. Click on ...
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: viewport
    attributes:
      label: Canvas Viewport
      options:
        - Desktop
        - Tablet
        - Mobile
        - Fullscreen Preview
        - All
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Browser, OS, and Node version (if running locally).
      placeholder: |
        - Browser: Chrome 122
        - OS: Windows 11 / macOS / Ubuntu
        - Node Version (if local): v20.x
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Console Logs
      description: Attach screenshots, screen recordings, or browser console stack traces if available.
